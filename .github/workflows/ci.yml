name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: node --test
      - name: The CLI runs
        run: node bin/show-your-work.mjs --version

  plugin:
    name: The plugin installs in Claude Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate .
      - name: Install from this checkout into a scratch config
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/claude
        run: |
          claude plugin marketplace add "$GITHUB_WORKSPACE"
          claude plugin install show-your-work@show-your-work
          claude plugin list | tee plugins.txt
          grep -q "show-your-work@show-your-work" plugins.txt
          grep -q "enabled" plugins.txt
